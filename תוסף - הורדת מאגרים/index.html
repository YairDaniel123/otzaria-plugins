<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הורדת מאגרי ספרים</title>
<style>
:root {
    --primary: #1976d2;
    --on-primary: #ffffff;
    --surface: #ffffff;
    --on-surface: #1a1a1a;
    --surface-container: #f3f4f6;
    --outline: #d1d5db;
    --font-family: system-ui, sans-serif;
    --font-size: 15px;
    --line-height: 1.5;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--surface);
    color: var(--on-surface);
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: var(--line-height);
    padding: 20px 20px 60px;
}

h2 {
    color: var(--primary);
    font-size: 1.4rem;
    margin-bottom: 4px;
}
#release-name {
    font-size: 0.8rem;
    opacity: 0.5;
    margin-bottom: 16px;
}

/* שגיאה */
#error-msg {
    display: none;
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
}

/* פס המאגר המלא */
.full-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-container);
    border: 1px solid var(--outline);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
}
.full-bar span { flex: 1; font-weight: 600; font-size: 0.95rem; }
#full-library-btn {
    display: none;
    align-items: center;
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}
#full-library-btn:hover { opacity: 0.88; }

/* עץ */
#tree {
    border: 1px solid var(--outline);
    border-radius: 12px;
    overflow: hidden;
}
.tree-node + .tree-node { border-top: 1px solid var(--outline); }
.tree-children .tree-node { border-top: 1px solid var(--outline); }

.tree-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    transition: background 0.12s;
}
.tree-row:hover { background: var(--surface-container); }

.toggle {
    width: 16px;
    flex-shrink: 0;
    text-align: center;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--primary);
    user-select: none;
}

.node-name {
    flex: 1;
    font-size: 0.95rem;
}
.node-name.folder {
    font-weight: 600;
    cursor: pointer;
}
.node-name.folder:hover { color: var(--primary); }

.node-size {
    font-size: 0.75rem;
    opacity: 0.45;
    flex-shrink: 0;
    white-space: nowrap;
}

.dl-btn {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 14px;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    white-space: nowrap;
}
.dl-btn:hover { opacity: 0.88; }
.dl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.loading, .empty {
    text-align: center;
    padding: 36px;
    opacity: 0.45;
}
</style>
</head>
<body>

<h2>הורדת מאגרי ספרים</h2>
<div id="release-name"></div>

<div id="error-msg"></div>

<div class="full-bar">
    <span>המאגר המלא — כל הספרים בקובץ אחד</span>
    <button id="full-library-btn">הורד הכל</button>
</div>

<div id="copy-toast" style="display:none;position:fixed;bottom:20px;right:20px;left:20px;background:#1a1a1a;color:#fff;border-radius:12px;padding:14px 16px;z-index:999;font-size:0.88rem;box-shadow:0 4px 20px rgba(0,0,0,0.35);">
    <div style="font-weight:700;margin-bottom:6px;">✓ הקישור הועתק ללוח — הדבק בדפדפן להורדה</div>
    <div class="copy-url" style="opacity:0.6;font-size:0.78rem;word-break:break-all;direction:ltr;text-align:left;"></div>
</div>

<div id="tree">
    <div class="loading" id="loading">טוען רשימה...</div>
</div>

<script src="books_data.js"></script>
<script src="app.js"></script>
</body>
</html>
